# CEP client — domains: cep-svasthyaa.fybud.com / api.cep-svasthyaa.fybud.com (+ admin)
# DB credentials (shared Postgres): user=password=cep-svasthyaa

server {
    listen 80;
    server_name __WEB_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __WEB_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__WEB_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WEB_HOST__/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name __API_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

