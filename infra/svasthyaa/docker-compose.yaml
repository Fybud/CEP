# CEP — svasthyaa tenant (multi-tenant example).
# Same image-only pattern as infra/demo; Deploy assigns distinct host ports.
# Shared Postgres: user=password=cep-svasthyaa, DBs cep-svasthyaa + cep-svasthyaa-admin.
# Domains: cep-svasthyaa.fybud.com / api.cep-svasthyaa.fybud.com (+ admin pair).
# Nginx: infra/svasthyaa/nginx/cep-svasthyaa.fybud.com.conf (installed on first deploy).

name: cep-svasthyaa

services:
  platform-api:
    image: fiberai/cep-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PLATFORM_PORT: 4100
      PLATFORM_API_BASE_URL: ${PLATFORM_API_BASE_URL:?PLATFORM_API_BASE_URL required}
      PLATFORM_WEB_BASE_URL: ${PLATFORM_WEB_BASE_URL:?PLATFORM_WEB_BASE_URL required}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?PLATFORM_DATABASE_URL required}
      PLATFORM_MIGRATE_DATABASE_URL: ${PLATFORM_MIGRATE_DATABASE_URL:-${PLATFORM_DATABASE_URL}}
      INTENT_CLASSIFIER_URL: ${INTENT_CLASSIFIER_URL:-http://intent-classifier:8091}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4100}:4100"
    networks: [fiberai-net]

  platform-web:
    image: fiberai/cep-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${PLATFORM_API_BASE_URL:?PLATFORM_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-9000}:5173"
    depends_on: [platform-api]
    networks: [fiberai-net]

  admin-api:
    image: fiberai/cep-admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL required}
    ports:
      - "127.0.0.1:${ADMIN_API_HOST_PORT:-4200}:4200"
    networks: [fiberai-net]

  admin-web:
    image: fiberai/cep-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:?ADMIN_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${ADMIN_WEB_HOST_PORT:-4201}:5173"
    depends_on: [admin-api]
    networks: [fiberai-net]

networks:
  fiberai-net:
    external: true
