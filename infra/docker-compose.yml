# CEP — public web/api only. Host ports injected by Fybud Deploy into ${*_HOST_PORT}.
name: cep

services:
  platform-api:
    image: fybud/cep-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PLATFORM_PORT: 4100
      PLATFORM_API_BASE_URL: ${PLATFORM_API_BASE_URL:?PLATFORM_API_BASE_URL required}
      PLATFORM_WEB_BASE_URL: ${PLATFORM_WEB_BASE_URL:?PLATFORM_WEB_BASE_URL required}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?PLATFORM_DATABASE_URL required}
      PLATFORM_MIGRATE_DATABASE_URL: ${PLATFORM_MIGRATE_DATABASE_URL:-${PLATFORM_DATABASE_URL}}
      INTENT_CLASSIFIER_URL: ${INTENT_CLASSIFIER_URL:-http://intent-classifier:8091}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4100"
    labels:
      fybud.expose: "true"
      fybud.domain: api.cep.fybud.com
    networks: [fybud-net]

  platform-web:
    image: fybud/cep-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL: ${PLATFORM_API_BASE_URL:?PLATFORM_API_BASE_URL required}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    labels:
      fybud.expose: "true"
      fybud.domain: cep.fybud.com
    depends_on: [platform-api]
    networks: [fybud-net]

networks:
  fybud-net:
    name: fybud-net
    external: true
