# CEP — public web/api; intent-classifier private.
# Only Deploy-injected: IMAGE_TAG + *_HOST_PORT. Everything else = paste (.env.deploy).
name: cep

services:
  platform-api:
    image: fybud/cep-api:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      JWT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      SUPER_ADMIN_EMAIL:
      AWS_REGION:
      AWS_S3_BUCKET:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      MOCK:
      GMAIL_CLIENT_ID:
      GMAIL_CLIENT_SECRET:
      GMAIL_PUBSUB_TOPIC:
      WHATSAPP_PHONE_NUMBER_ID:
      WHATSAPP_ACCESS_TOKEN:
      INSTAGRAM_APP_ID:
      INSTAGRAM_APP_SECRET:
      SHOPIFY_SHOP:
      SHOPIFY_CLIENT_ID:
      SHOPIFY_CLIENT_SECRET:
      OPENAI_API_KEY:
      OPENAI_MODEL:
      INTENT_CLASSIFIER_URL:
      PLATFORM_PORT:
      PLATFORM_API_BASE_URL:
      PLATFORM_WEB_BASE_URL:
      PLATFORM_DATABASE_URL:
      PLATFORM_MIGRATE_DATABASE_URL:
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4100"
    labels:
      fybud.expose: "true"
      fybud.domain: api.cep.fybud.com
      fybud.role: api
      fybud.health: "/health"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  platform-web:
    image: fybud/cep-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_BASE_URL:
      VITE_GOOGLE_CLIENT_ID:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    labels:
      fybud.expose: "true"
      fybud.domain: cep.fybud.com
      fybud.role: web
      fybud.health: "any"
    depends_on: [platform-api]
    networks: [internal]

  intent-classifier:
    image: fybud/cep-intent-classifier:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8091),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

volumes:
  uploads:

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
