name: cep-svasthyaa

services:
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
    env_file:
      - ./platform-api/.env.svasthyaa
    environment:
      # Shared classifier on cep-network (run separately from intent-classifier/)
      INTENT_CLASSIFIER_URL: http://intent-classifier:8091
    ports:
      - "4100:4100"
    networks:
      - cep-network

  platform-web:
    build:
      context: ./platform-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.cep-svasthyaa.fybud.com
    env_file:
      - ./platform-web/.env.svasthyaa
    ports:
      - "9000:5173"
    depends_on:
      - platform-api
    networks:
      - cep-network

networks:
  cep-network:
    external: true
