# Shared intent classifier — run once; demo + svasthyaa both call it on cep-network.
#   cd intent-classifier && docker compose up -d --build
services:
  intent-classifier:
    build: .
    container_name: intent-classifier
    ports:
      - "8091:8091"
    environment:
      HOST: "0.0.0.0"
      PORT: "8091"
      INTENT_MODEL_PATH: /app/models/intent_clf.joblib
    # Optional: override baked model with a host-trained one
    # volumes:
    #   - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - cep-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Same external network as cep-postgres, demo API, and svasthyaa API
  cep-network:
    external: true
