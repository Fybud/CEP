name: cep-database

services:
  cep-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
    ports:
      - "5432:5432"
    volumes:
      - cep_pg_data:/var/lib/postgresql/data
    networks:
      - cep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cep_pg_data:
    name: cep-svasthyaa-pg-data
    external: true

networks:
  cep-network:
    name: cep-network
    driver: bridge
